<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>إكس أو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg: #12121c;
    --bg-soft: #191a28;
    --card: #1e1f30;
    --line: #33344a;
    --text: #f0eee6;
    --text-dim: #8c8da6;
    --x-color: #e8a33d;
    --o-color: #4fbdb0;
    --danger: #d9695f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(circle at 15% 10%, rgba(232,163,61,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(79,189,176,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
  }
  h1,h2,h3,.display{ font-family:'Cairo', sans-serif; }
  .app{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
  }
  .screen{ width:100%; max-width:420px; }

  /* ---------- Landing ---------- */
  .landing{ text-align:center; }
  .brand{
    font-size:52px; font-weight:800; letter-spacing:2px; margin:0 0 4px;
  }
  .brand span:first-child{ color:var(--x-color); }
  .brand span:last-child{ color:var(--o-color); }
  .tagline{ color:var(--text-dim); font-size:15px; margin:0 0 28px; }

  .cities{
    display:flex; align-items:center; justify-content:center;
    gap:10px; margin-bottom:36px; color:var(--text-dim); font-size:14px;
  }
  .city-dot{
    width:9px; height:9px; border-radius:50%; flex:none;
  }
  .city-dot.a{ background:var(--x-color); box-shadow:0 0 10px rgba(232,163,61,.7); }
  .city-dot.b{ background:var(--o-color); box-shadow:0 0 10px rgba(79,189,176,.7); }
  .link-line{
    width:70px; height:1px; position:relative; overflow:visible;
    background: repeating-linear-gradient(90deg, var(--text-dim) 0 5px, transparent 5px 10px);
    opacity:.5;
  }
  .link-line::after{
    content:''; position:absolute; top:-3px; width:7px; height:7px; border-radius:50%;
    background:var(--text); opacity:.9;
    animation: travel 2.6s linear infinite;
  }
  @keyframes travel{
    0%{ right:0; opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:1; }
    100%{ right:100%; opacity:0; }
  }

  .btn{
    display:block; width:100%; border:none; border-radius:14px;
    padding:16px; font-family:'Tajawal',sans-serif; font-weight:700; font-size:16px;
    cursor:pointer; transition:transform .15s ease, filter .15s ease;
  }
  .btn:disabled{ opacity:.55; cursor:default; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--x-color); color:#20150a; margin-bottom:14px; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-outline{
    background:transparent; color:var(--o-color); border:1.5px solid var(--o-color);
  }
  .btn-outline:hover{ background:rgba(79,189,176,.08); }
  .btn-ghost{
    background:transparent; color:var(--text-dim); border:1px solid var(--line);
  }

  .divider-word{ color:var(--text-dim); font-size:13px; margin:18px 0; position:relative; }

  .join-row{ display:flex; gap:8px; margin-top:6px; }
  .join-row input{
    flex:1; min-width:0; background:var(--card); border:1.5px solid var(--line);
    border-radius:12px; color:var(--text); font-family:'Cairo',sans-serif; font-weight:700;
    font-size:20px; letter-spacing:4px; text-align:center; padding:14px 8px;
  }
  .join-row input:focus{ outline:none; border-color:var(--o-color); }
  .join-row .btn{ width:auto; padding:0 20px; }

  .error-msg{
    color:var(--danger); font-size:13px; margin-top:10px; min-height:16px;
  }

  /* ---------- Room ---------- */
  .room{ }
  .room-top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:26px;
  }
  .code-pill{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--line);
    border-radius:100px; padding:8px 8px 8px 16px;
  }
  .code-pill .label{ font-size:11px; color:var(--text-dim); }
  .code-pill .code{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:18px; letter-spacing:3px;
  }
  .copy-btn{
    background:var(--bg-soft); border:none; color:var(--text);
    border-radius:100px; width:34px; height:34px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .copy-btn.copied{ color:var(--o-color); }
  .exit-btn{
    background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer;
    font-family:'Tajawal',sans-serif;
  }

  .status-bar{
    text-align:center; margin-bottom:20px; min-height:44px;
  }
  .status-text{ font-size:15px; font-weight:700; }
  .status-text.mine{ color:var(--x-color); }
  .status-text.mine.as-o{ color:var(--o-color); }
  .status-sub{ font-size:13px; color:var(--text-dim); margin-top:4px; }

  .conn-row{
    display:flex; justify-content:center; gap:18px; margin-bottom:18px; font-size:13px; color:var(--text-dim);
  }
  .conn-item{ display:flex; align-items:center; gap:6px; }
  .conn-dot{ width:8px; height:8px; border-radius:50%; background:var(--line); }
  .conn-dot.on{ background:var(--o-color); box-shadow:0 0 8px rgba(79,189,176,.7); }

  .board{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    background:var(--line); border-radius:18px; padding:8px;
    aspect-ratio:1/1;
  }
  .cell{
    background:var(--card); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:700; font-size:42px;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    transition:background .15s ease;
  }
  .cell.disabled{ cursor:default; }
  .cell:not(.filled):not(.disabled):active{ background:var(--bg-soft); }
  .cell.x{ color:var(--x-color); }
  .cell.o{ color:var(--o-color); }
  .cell.win{ background:rgba(232,163,61,.14); }
  .cell.o.win{ background:rgba(79,189,176,.14); }

  .result-wrap{ margin-top:22px; text-align:center; min-height:78px; }
  .result-text{ font-size:19px; font-weight:800; margin-bottom:14px; }
  .result-text.win{ color:var(--x-color); }
  .result-text.win.as-o{ color:var(--o-color); }
  .result-text.lose{ color:var(--danger); }
  .result-text.draw{ color:var(--text-dim); }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="app">

  <!-- LANDING -->
  <div class="screen landing" id="landing">
    <h1 class="brand"><span>✕</span><span>◯</span></h1>
    <p class="tagline">إكس أو، بس بينكم انتو الثنين</p>

    <div class="cities">
      <span>بغداد</span>
      <span class="link-line"></span>
      <span>أربيل</span>
    </div>

    <button class="btn btn-primary" id="btnCreate">إنشاء كود</button>

    <div class="divider-word">أو</div>

    <div class="join-row">
      <input type="text" id="joinInput" placeholder="اكتب الكود" maxlength="4" inputmode="numeric">
      <button class="btn btn-outline" id="btnJoin">إدخل كود</button>
    </div>
    <div class="error-msg" id="landingError"></div>
  </div>

  <!-- ROOM -->
  <div class="screen room hidden" id="room">
    <div class="room-top">
      <div class="code-pill">
        <div>
          <div class="label">كود الغرفة</div>
          <div class="code" id="roomCodeText">----</div>
        </div>
        <button class="copy-btn" id="copyBtn" title="نسخ">⧉</button>
      </div>
      <button class="exit-btn" id="exitBtn">خروج</button>
    </div>

    <div class="conn-row">
      <div class="conn-item"><span class="conn-dot on"></span><span id="meLabel">إنت (✕)</span></div>
      <div class="conn-item"><span class="conn-dot" id="oppDot"></span><span id="oppLabel">صديقك</span></div>
    </div>

    <div class="status-bar">
      <div class="status-text" id="statusText">بانتظار صديقك يدخل الكود...</div>
      <div class="status-sub" id="statusSub"></div>
    </div>

    <div class="board" id="board"></div>

    <div class="result-wrap" id="resultWrap"></div>
  </div>

</div>

<script>
(function(){
  const landing = document.getElementById('landing');
  const roomScreen = document.getElementById('room');
  const btnCreate = document.getElementById('btnCreate');
  const btnJoin = document.getElementById('btnJoin');
  const joinInput = document.getElementById('joinInput');
  const landingError = document.getElementById('landingError');
  const roomCodeText = document.getElementById('roomCodeText');
  const copyBtn = document.getElementById('copyBtn');
  const exitBtn = document.getElementById('exitBtn');
  const boardEl = document.getElementById('board');
  const statusText = document.getElementById('statusText');
  const statusSub = document.getElementById('statusSub');
  const resultWrap = document.getElementById('resultWrap');
  const meLabel = document.getElementById('meLabel');
  const oppLabel = document.getElementById('oppLabel');
  const oppDot = document.getElementById('oppDot');

  const ID_PREFIX = 'xogame-iq-';

  let roomCode = null;
  let localPlayer = null; // 'X' or 'O'
  let peer = null;
  let conn = null;
  let cellEls = [];
  let joinTimeoutHandle = null;

  let state = { board: Array(9).fill(null), turn: 'X', winner: null, line: null, round: 0 };

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  function checkResult(board){
    for(const line of WIN_LINES){
      const [a,b,c] = line;
      if(board[a] && board[a]===board[b] && board[a]===board[c]){
        return { winner: board[a], line };
      }
    }
    if(board.every(v => v)) return { winner: 'draw', line: null };
    return { winner: null, line: null };
  }

  function buildBoard(){
    boardEl.innerHTML = '';
    cellEls = [];
    for(let i=0;i<9;i++){
      const c = document.createElement('div');
      c.className = 'cell';
      c.dataset.index = i;
      c.addEventListener('click', () => onCellClick(i));
      boardEl.appendChild(c);
      cellEls.push(c);
    }
  }
  buildBoard();

  function genCode(){
    return String(Math.floor(1000 + Math.random()*9000));
  }

  function resetState(round){
    state = {
      board: Array(9).fill(null),
      turn: (round % 2 === 0) ? 'X' : 'O',
      winner: null,
      line: null,
      round: round
    };
  }

  function isConnected(){
    return !!(conn && conn.open);
  }

  function sendMsg(obj){
    if(isConnected()) conn.send(obj);
  }

  // ---------- Create room (host = X) ----------
  function createRoom(attempt){
    attempt = attempt || 0;
    if(attempt > 8){
      landingError.textContent = 'صار خطأ، حاول مرة ثانية.';
      btnCreate.disabled = false;
      return;
    }
    const code = genCode();
    const p = new Peer(ID_PREFIX + code);

    let settled = false;

    p.on('open', () => {
      if(settled) return;
      settled = true;
      peer = p;
      roomCode = code;
      localPlayer = 'X';
      enterRoom();

      peer.on('connection', (incoming) => {
        if(conn){ incoming.close(); return; } // only one opponent
        conn = incoming;
        wireConnection();
      });
    });

    p.on('error', (err) => {
      if(settled) return;
      if(err && err.type === 'unavailable-id'){
        p.destroy();
        createRoom(attempt + 1);
      }else{
        settled = true;
        p.destroy();
        landingError.textContent = 'ما كدرنا نتصل بالسيرفر، تأكد من الانترنت وحاول مرة ثانية.';
        btnCreate.disabled = false;
      }
    });
  }

  // ---------- Join room (guest = O) ----------
  function joinRoom(){
    const code = joinInput.value.trim();
    landingError.textContent = '';
    if(!/^\d{4}$/.test(code)){
      landingError.textContent = 'اكتب كود مكون من 4 أرقام.';
      return;
    }
    btnJoin.disabled = true;

    const p = new Peer();
    let settled = false;

    function fail(msg){
      if(settled) return;
      settled = true;
      clearTimeout(joinTimeoutHandle);
      p.destroy();
      landingError.textContent = msg;
      btnJoin.disabled = false;
    }

    p.on('open', () => {
      const c = p.connect(ID_PREFIX + code, { reliable: true });
      conn = c;

      joinTimeoutHandle = setTimeout(() => {
        fail('ما لكينا هذا الكود، تأكد منه وحاول مرة ثانية.');
      }, 9000);

      c.on('open', () => {
        if(settled) return;
        settled = true;
        clearTimeout(joinTimeoutHandle);
        peer = p;
        roomCode = code;
        localPlayer = 'O';
        enterRoom();
        wireConnection();
      });

      c.on('error', () => fail('ما لكينا هذا الكود، تأكد منه وحاول مرة ثانية.'));
    });

    p.on('error', (err) => {
      if(err && err.type === 'peer-unavailable'){
        fail('ما لكينا هذا الكود، تأكد منه وحاول مرة ثانية.');
      }else{
        fail('ما كدرنا نتصل بالسيرفر، تأكد من الانترنت وحاول مرة ثانية.');
      }
    });
  }

  function wireConnection(){
    render(); // opponent just connected
    conn.on('data', (data) => {
      if(data.type === 'move'){
        applyRemoteMove(data.index);
      }else if(data.type === 'rematch'){
        resetState(data.round);
        render();
      }
    });
    conn.on('close', () => {
      conn = null;
      render();
    });
    conn.on('error', () => {
      conn = null;
      render();
    });
  }

  function enterRoom(){
    landing.classList.add('hidden');
    roomScreen.classList.remove('hidden');
    roomCodeText.textContent = roomCode;
    if(localPlayer === 'X'){
      meLabel.textContent = 'إنت (✕)';
      oppLabel.textContent = 'صديقك (◯)';
    }else{
      meLabel.textContent = 'إنت (◯)';
      oppLabel.textContent = 'صديقك (✕)';
    }
    resetState(0);
    render();
  }

  function leaveRoom(){
    if(conn){ try{ conn.close(); }catch(e){} }
    if(peer){ try{ peer.destroy(); }catch(e){} }
    conn = null;
    peer = null;
    roomCode = null;
    localPlayer = null;
    roomScreen.classList.add('hidden');
    landing.classList.remove('hidden');
    joinInput.value = '';
    landingError.textContent = '';
    btnCreate.disabled = false;
    btnJoin.disabled = false;
  }

  function applyRemoteMove(index){
    const oppPlayer = localPlayer === 'X' ? 'O' : 'X';
    if(state.board[index]) return; // ignore invalid
    state.board[index] = oppPlayer;
    const result = checkResult(state.board);
    state.winner = result.winner;
    state.line = result.line;
    state.turn = localPlayer;
    render();
  }

  function render(){
    oppDot.classList.toggle('on', isConnected());

    state.board.forEach((v, i) => {
      const c = cellEls[i];
      c.classList.remove('x','o','filled','win');
      if(v){
        c.textContent = v === 'X' ? '✕' : '◯';
        c.classList.add(v.toLowerCase(), 'filled');
      }else{
        c.textContent = '';
      }
    });

    const bothJoined = isConnected();
    const iAmTurn = state.turn === localPlayer;
    const gameOver = !!state.winner;

    cellEls.forEach((c, i) => {
      const canPlay = bothJoined && !gameOver && iAmTurn && !state.board[i];
      c.classList.toggle('disabled', !canPlay);
    });

    if(state.line){
      state.line.forEach(i => cellEls[i].classList.add('win'));
    }

    if(!bothJoined){
      statusText.textContent = localPlayer === 'X'
        ? 'بانتظار صديقك يدخل الكود...'
        : 'انقطع الاتصال بصديقك...';
      statusText.className = 'status-text';
      statusSub.textContent = '';
      resultWrap.innerHTML = '';
      return;
    }

    if(gameOver){
      resultWrap.innerHTML = '';
      const box = document.createElement('div');
      let msg, cls;
      if(state.winner === 'draw'){
        msg = 'تعادل! ما حد فاز';
        cls = 'draw';
      }else if(state.winner === localPlayer){
        msg = 'فزت! 🎉';
        cls = 'win' + (localPlayer === 'O' ? ' as-o' : '');
      }else{
        msg = 'خسرت هالجولة';
        cls = 'lose';
      }
      box.className = 'result-text ' + cls;
      box.textContent = msg;
      resultWrap.appendChild(box);

      const btn = document.createElement('button');
      btn.className = 'btn btn-outline';
      btn.textContent = 'لعبة جديدة';
      btn.style.maxWidth = '220px';
      btn.style.margin = '0 auto';
      btn.addEventListener('click', rematch);
      resultWrap.appendChild(btn);

      statusText.textContent = 'انتهت الجولة';
      statusText.className = 'status-text';
      statusSub.textContent = '';
    }else{
      resultWrap.innerHTML = '';
      if(iAmTurn){
        statusText.textContent = 'دورك';
        statusText.className = 'status-text mine' + (localPlayer === 'O' ? ' as-o' : '');
      }else{
        statusText.textContent = 'دور صديقك';
        statusText.className = 'status-text';
      }
      statusSub.textContent = '';
    }
  }

  function onCellClick(index){
    if(!isConnected()) return;
    if(state.winner) return;
    if(state.turn !== localPlayer) return;
    if(state.board[index]) return;

    state.board[index] = localPlayer;
    const result = checkResult(state.board);
    state.winner = result.winner;
    state.line = result.line;
    state.turn = localPlayer === 'X' ? 'O' : 'X';

    sendMsg({ type: 'move', index });
    render();
  }

  function rematch(){
    const nextRound = (state.round || 0) + 1;
    resetState(nextRound);
    sendMsg({ type: 'rematch', round: nextRound });
    render();
  }

  copyBtn.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(roomCode);
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = roomCode;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    copyBtn.classList.add('copied');
    copyBtn.textContent = '✓';
    setTimeout(() => {
      copyBtn.classList.remove('copied');
      copyBtn.textContent = '⧉';
    }, 1400);
  });

  exitBtn.addEventListener('click', leaveRoom);
  btnCreate.addEventListener('click', () => {
    btnCreate.disabled = true;
    landingError.textContent = '';
    createRoom(0);
  });
  btnJoin.addEventListener('click', joinRoom);
  joinInput.addEventListener('input', () => {
    joinInput.value = joinInput.value.replace(/\D/g,'');
  });
  joinInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') joinRoom();
  });
})();
</script>

</body>
</html>
